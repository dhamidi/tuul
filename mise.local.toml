# How tuul builds tuul. Toolchain lives in mise.toml.
#
# Plain javac and plain java: tuul uses no preview APIs, so its class files run
# on any JDK of this release or newer rather than on one exact build of one.

[tasks.build]
description = "Compile src/ into build/classes"
run = '''
set -euo pipefail
release=$(javac --version | cut -d' ' -f2 | cut -d. -f1)
mkdir -p build/classes
javac --release "$release" -nowarn -d build/classes $(find src -name '*.java')
java --enable-native-access=ALL-UNNAMED -cp build/classes main build --native
'''

[tasks.test]
description = "Compile and run everything under test/"
depends = ["build"]
run = '''
set -euo pipefail
release=$(javac --version | cut -d' ' -f2 | cut -d. -f1)
mkdir -p build/test
javac --release "$release" -nowarn -cp build/classes -d build/test $(find test -name '*.java')
java --enable-native-access=ALL-UNNAMED -cp build/classes:build/test run
'''

[tasks.natives]
description = "Cross-build the native modules for every platform tuul ships"
depends = ["build"]
run = '''
set -euo pipefail
echo '{"type":"project.natives"}' | java --enable-native-access=ALL-UNNAMED -cp build/classes main message
'''

[tasks.self-test]
description = "Scaffold a project in a temporary directory and exercise tuul on it"
depends = ["build"]
run = 'java --enable-native-access=ALL-UNNAMED -cp build/classes main self-test'

[tasks.tuul]
description = "Run the cli, e.g. mise run tuul -- docs json.Json"
depends = ["build"]
run = 'java --enable-native-access=ALL-UNNAMED -cp build/classes main'

[tasks.clean]
description = "Remove build output"
run = 'rm -rf build'
