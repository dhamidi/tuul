# tuul builds tuul with mise, and nothing else.
#
# Plain javac and plain java: tuul uses no preview APIs, so its class files run
# on any JDK of this release or newer rather than on one exact build of one.

[tools]
java = "latest"

[tasks.build]
description = "Compile src/ into build/classes"
run = '''
set -euo pipefail
release=$(javac --version | cut -d' ' -f2 | cut -d. -f1)
mkdir -p build/classes
javac --release "$release" -nowarn -d build/classes $(find src -name '*.java')
# javac -d writes class files and nothing else, so anything beside the code
# that is not code has to be put on the classpath by hand.
(cd src && find . -type f ! -name '*.java' -exec sh -c 'mkdir -p "../build/classes/$(dirname "$1")" && cp "$1" "../build/classes/$1"' _ {} \;)
java --enable-native-access=ALL-UNNAMED -cp build/classes main build --native
'''

[tasks.test]
description = "Compile and run everything under test/"
depends = ["build"]
run = '''
set -euo pipefail
release=$(javac --version | cut -d' ' -f2 | cut -d. -f1)
mkdir -p build/test
javac --release "$release" -nowarn -cp build/classes -d build/test $(find test -name '*.java')
(cd test && find . -type f ! -name '*.java' -exec sh -c 'mkdir -p "../build/test/$(dirname "$1")" && cp "$1" "../build/test/$1"' _ {} \;)
# The application's own specs, on the classpath under the name they are loaded
# by, so editing one and re-running is all it takes.
mkdir -p build/test/spec
(cd spec && find . -type f -exec sh -c 'mkdir -p "../build/test/spec/$(dirname "$1")" && cp "$1" "../build/test/spec/$1"' _ {} \;)
java --enable-native-access=ALL-UNNAMED -cp build/classes:build/test run
'''

[tasks.spec]
description = "Run the hyperspecs in spec/ against a live application"
depends = ["test"]
run = 'java --enable-native-access=ALL-UNNAMED -cp build/classes:build/test spec'

[tasks.natives]
description = "Cross-build the native modules for every platform tuul ships"
depends = ["build"]
run = '''
set -euo pipefail
echo '{"type":"project.natives"}' | java --enable-native-access=ALL-UNNAMED -cp build/classes main message
'''

[tasks.self-test]
description = "Scaffold a project in a temporary directory and exercise tuul on it"
depends = ["build"]
run = 'java --enable-native-access=ALL-UNNAMED -cp build/classes main self-test'

[tasks.tuul]
description = "Run the cli, e.g. mise run tuul -- docs json.Json"
depends = ["build"]
run = 'java --enable-native-access=ALL-UNNAMED -cp build/classes main'

[tasks.dist]
description = "Assemble the distribution: build/dist/tuul.jar and its sources"
depends = ["natives"]
run = '''
set -euo pipefail
version=$(java --enable-native-access=ALL-UNNAMED -cp build/classes main --version | cut -d' ' -f2)
mkdir -p build/dist
# The jar carries the prebuilt libraries and the web assets, because an
# installed tuul has no source tree to take them from and `tuul install` has to
# hand them to a project. Enable-Native-Access in the manifest is what lets
# `java -jar` run without a flag.
printf 'Main-Class: main\nEnable-Native-Access: ALL-UNNAMED\nImplementation-Title: tuul\nImplementation-Version: %s\n' "$version" > build/dist/manifest.txt
jar --create --file build/dist/tuul.jar --manifest build/dist/manifest.txt \
    -C build/classes . -C build/dist native -C . assets
# Beside it, because `tuul install` vendors sources so `tuul docs` can answer
# about tuul's own libraries with their comments.
jar --create --file "build/dist/tuul-$version-sources.jar" -C src .
ls -la build/dist/tuul.jar "build/dist/tuul-$version-sources.jar"
'''

[tasks.install]
description = "Install this tuul into ~/.local/bin, the way a release would"
depends = ["dist"]
run = '''
set -euo pipefail
version=$(java --enable-native-access=ALL-UNNAMED -cp build/classes main --version | cut -d' ' -f2)
home="${TUUL_HOME:-$HOME/.local/share/tuul}"
bin="${TUUL_BIN:-$HOME/.local/bin}"

# The payload lives together and the launcher points at it, because a jar finds
# its own SQLite and its own Turbo by looking beside itself — and a bin
# directory is no place for a native/ tree.
rm -rf "$home"
mkdir -p "$home" "$bin"
cp build/dist/tuul.jar "build/dist/tuul-$version-sources.jar" "$home/"
cp -R build/dist/native "$home/native"
cp -R assets "$home/assets"

printf '#!/bin/sh\n# Installed by `mise run install` from the tuul checkout.\nexec java -jar "%s/tuul.jar" "$@"\n' "$home" > "$bin/tuul"
chmod +x "$bin/tuul"

echo "installed $("$bin/tuul" --version) to $bin/tuul"
echo "  payload: $home"
case ":$PATH:" in *":$bin:"*) ;; *) echo "  note: $bin is not on your PATH" ;; esac
'''

[tasks.clean]
description = "Remove build output"
run = 'rm -rf build'
